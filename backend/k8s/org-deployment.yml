---
# ==================== NetworkPolicy ====================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: org-center-api
  namespace: org-center-prod
  labels:
    app: org-center-api
spec:
  podSelector:
    matchLabels:
      app: org-center-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # 允许 Ingress 流量
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  # 允许监控抓取
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  egress:
  # 允许 DNS 查询
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
  # 允许访问 MySQL
  - to:
    - podSelector:
        matchLabels:
          app: mysql
    ports:
    - protocol: TCP
      port: 3306
  # 允许访问 Redis
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # 允许访问 Elasticsearch
  - to:
    - podSelector:
        matchLabels:
          app: elasticsearch
    ports:
    - protocol: TCP
      port: 9200
  # 允许访问 Jaeger
  - to:
    - podSelector:
        matchLabels:
          app: jaeger-collector
    ports:
    - protocol: TCP
      port: 14268

---
# ==================== ServiceMonitor (Prometheus Operator) ====================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: org-center-api
  namespace: org-center-prod
  labels:
    app: org-center-api
spec:
  selector:
    matchLabels:
      app: org-center-api
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    scheme: http

---
# ==================== 配置说明 ====================
#
# 1. Deployment 配置:
#    - 副本数: 3 (可自动扩缩容到 10)
#    - 资源请求: 500m CPU, 512Mi 内存
#    - 资源限制: 2000m CPU, 2Gi 内存
#    - 零停机滚动更新
#
# 2. 健康检查:
#    - Liveness: /health/live (30s 后开始)
#    - Readiness: /health/ready (10s 后开始)
#    - Startup: /health/startup (立即开始)
#
# 3. Service:
#    - ClusterIP 类型
#    - 会话保持: ClientIP (3小时)
#    - 暴露 HTTP 和 Metrics 端口
#
# 4. Ingress:
#    - TLS/HTTPS 支持
#    - 限流: 1000 RPS
#    - CORS 配置
#    - 代理超时: 600s
#
# 5. HPA (自动扩缩容):
#    - 最小副本: 3
#    - 最大副本: 10
#    - 扩容指标: CPU > 70%, 内存 > 80%, QPS > 1000
#    - 快速扩容,缓慢缩容
#
# 6. PDB (Pod中断预算):
#    - 保证至少 2 个 Pod 可用
#    - 防止节点维护时服务中断
#
# 7. 网络策略:
#    - 严格的入站/出站控制
#    - 仅允许必要的通信
#
# 使用方法:
#   kubectl apply -f org-deployment.yml
#
# 监控部署:
#   kubectl get pods -n org-center-prod -l app=org-center-api -w
#   kubectl get hpa -n org-center-prod -w
#
# 查看日志:
#   kubectl logs -f -n org-center-prod -l app=org-center-api --all-containers=true
# ========================================
