# Prometheus配置文件
# ZKER监控系统

global:
  scrape_interval: 15s        # 每15秒抓取一次指标
  evaluation_interval: 15s    # 每15秒评估一次规则
  external_labels:
    cluster: 'zker-production'
    environment: 'production'

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'localhost:9093'  # Alertmanager地址

# 规则文件
rule_files:
  - 'alerts.yml'

# 抓取配置
scrape_configs:
  # ZKER API服务监控
  - job_name: 'zker-api'
    static_configs:
      - targets: ['localhost:8080']
        labels:
          service: 'zker-api'
          team: 'backend'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # MySQL监控(如果使用mysqld_exporter)
  - job_name: 'mysql'
    static_configs:
      - targets: ['localhost:9104']
        labels:
          service: 'mysql'
    scrape_interval: 30s

  # Redis监控(如果使用redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:9121']
        labels:
          service: 'redis'
    scrape_interval: 30s

  # Node Exporter(系统指标)
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          service: 'node-exporter'
    scrape_interval: 15s

  # Prometheus自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
