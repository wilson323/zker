// 租户服务API定义
syntax = "proto3";

package tenant;

option go_package = "github.com/coze-studio/coze-studio/backend/api/tenant/v1;tenant";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// ========== 租户服务 ==========
service TenantService {
  // 创建租户
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse) {
    option (google.api.http) = {
      post: "/api/v1/tenants"
      body: "*"
    };
  }

  // 获取租户详情
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse) {
    option (google.api.http) = {
      get: "/api/v1/tenants/{tenant_id}"
    };
  }

  // 更新租户
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse) {
    option (google.api.http) = {
      put: "/api/v1/tenants/{tenant_id}"
      body: "*"
    };
  }

  // 删除租户
  rpc DeleteTenant(DeleteTenantRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/tenants/{tenant_id}"
    };
  }

  // 租户列表
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse) {
    option (google.api.http) = {
      get: "/api/v1/tenants"
    };
  }

  // 更新租户状态
  rpc UpdateTenantStatus(UpdateTenantStatusRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/api/v1/tenants/{tenant_id}/status"
      body: "*"
    };
  }

  // ========== 订阅管理 RPC ==========

  // 获取订阅信息
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse) {
    option (google.api.http) = {
      get: "/api/v1/tenants/{tenant_id}/subscription"
    };
  }

  // 更新订阅
  rpc UpdateSubscription(UpdateSubscriptionRequest) returns (UpdateSubscriptionResponse) {
    option (google.api.http) = {
      put: "/api/v1/tenants/{tenant_id}/subscription"
      body: "*"
    };
  }

  // 升级订阅等级
  rpc UpgradeSubscription(UpgradeSubscriptionRequest) returns (UpgradeSubscriptionResponse) {
    option (google.api.http) = {
      post: "/api/v1/tenants/{tenant_id}/subscription/upgrade"
      body: "*"
    };
  }
}

// ========== 请求消息 ==========

// CreateTenantRequest 创建租户请求
message CreateTenantRequest {
  string tenant_id = 1;           // 租户ID (可选，系统生成)
  string name = 2;                 // 租户名称
  string domain = 3;               // 租户域名
  string tier = 4;                 // 套餐类型: free, basic, premium, enterprise
  string status = 5;               // 状态: active, suspended, deleted
  map<string, string> metadata = 6; // 元数据
}

// GetTenantRequest 获取租户请求
message GetTenantRequest {
  string tenant_id = 1; // 租户ID
}

// UpdateTenantRequest 更新租户请求
message UpdateTenantRequest {
  string tenant_id = 1;           // 租户ID
  string name = 2;                 // 租户名称 (可选)
  string domain = 3;               // 租户域名 (可选)
  map<string, string> metadata = 4; // 元数据 (可选)
}

// DeleteTenantRequest 删除租户请求
message DeleteTenantRequest {
  string tenant_id = 1; // 租户ID
}

// ListTenantsRequest 租户列表请求
message ListTenantsRequest {
  int32 page_size = 1;         // 每页大小
  string page_token = 2;       // 页面令牌
  string status = 3;           // 状态过滤 (可选)
  string tier = 4;             // 套餐过滤 (可选)
  string search = 5;           // 搜索关键词 (可选)
}

// UpdateTenantStatusRequest 更新租户状态请求
message UpdateTenantStatusRequest {
  string tenant_id = 1; // 租户ID
  string status = 2;    // 新状态: active, suspended, deleted
}

// ========== 订阅管理请求消息 ==========

// GetSubscriptionRequest 获取订阅信息请求
message GetSubscriptionRequest {
  string tenant_id = 1; // 租户ID
}

// UpdateSubscriptionRequest 更新订阅请求
message UpdateSubscriptionRequest {
  string tenant_id = 1;              // 租户ID
  string billing_cycle = 2;          // 计费周期: monthly, yearly (可选)
  bool auto_renew = 3;               // 自动续费 (可选)
}

// UpgradeSubscriptionRequest 升级订阅请求
message UpgradeSubscriptionRequest {
  string tenant_id = 1;    // 租户ID
  string target_tier = 2;  // 目标等级: free, pro, enterprise
}

// ========== 响应消息 ==========

// CreateTenantResponse 创建租户响应
message CreateTenantResponse {
  Tenant tenant = 1; // 创建的租户
}

// GetTenantResponse 获取租户响应
message GetTenantResponse {
  Tenant tenant = 1; // 租户详情
}

// UpdateTenantResponse 更新租户响应
message UpdateTenantResponse {
  Tenant tenant = 1; // 更新后的租户
}

// ListTenantsResponse 租户列表响应
message ListTenantsResponse {
  repeated Tenant tenants = 1;     // 租户列表
  string next_page_token = 2;      // 下一页令牌
  int32 total_count = 3;           // 总数
}

// ========== 订阅管理响应消息 ==========

// GetSubscriptionResponse 获取订阅信息响应
message GetSubscriptionResponse {
  Subscription subscription = 1; // 订阅信息
}

// UpdateSubscriptionResponse 更新订阅响应
message UpdateSubscriptionResponse {
  Subscription subscription = 1; // 更新后的订阅信息
}

// UpgradeSubscriptionResponse 升级订阅响应
message UpgradeSubscriptionResponse {
  Tenant tenant = 1;       // 更新后的租户信息
  Subscription subscription = 2; // 更新后的订阅信息
}

// ========== 数据模型 ==========

// Tenant 租户
message Tenant {
  string tenant_id = 1;                    // 租户ID
  string name = 2;                        // 租户名称
  string domain = 3;                      // 租户域名
  string tier = 4;                        // 套餐类型
  string status = 5;                      // 状态
  google.protobuf.Timestamp created_at = 6;  // 创建时间
  google.protobuf.Timestamp updated_at = 7;  // 更新时间
  map<string, string> metadata = 8;         // 元数据

  // 关联数据
  Subscription subscription = 9;             // 订阅信息
  repeated QuotaLimit quotas = 10;          // 配额限制
}

// Subscription 订阅信息
message Subscription {
  string subscription_id = 1;             // 订阅ID
  string tenant_id = 2;                    // 租户ID
  string plan_tier = 3;                    // 套餐等级: free, pro, enterprise
  string billing_cycle = 4;                // 计费周期: monthly, yearly
  string status = 5;                       // 状态: active, suspended, cancelled, expired
  google.protobuf.Timestamp started_at = 6;  // 开始时间
  google.protobuf.Timestamp expires_at = 7;  // 到期时间
  bool auto_renew = 8;                     // 自动续费

  // 价格信息
  int64 monthly_price = 9;                // 月价格（分）
  int64 yearly_price = 10;                // 年价格（分）
  string currency = 11;                    // 货币: USD, CNY, EUR

  // 优惠信息
  string discount_code = 12;              // 优惠码
  int32 discount_percent = 13;            // 折扣百分比
  google.protobuf.Timestamp discount_expires_at = 14; // 优惠到期时间

  google.protobuf.Timestamp created_at = 15; // 创建时间
  google.protobuf.Timestamp updated_at = 16; // 更新时间
}

// QuotaLimit 配额限制
message QuotaLimit {
  string tenant_id = 1;         // 租户ID
  string resource_type = 2;    // 资源类型: bots, workflows, messages, storage, team_members
  int32 limit = 3;              // 限制
  string tier = 4;              // 套餐类型
  google.protobuf.Timestamp reset_time = 5; // 重置时间
  string reset_cycle = 6;       // 重置周期: daily, weekly, monthly, yearly
}
