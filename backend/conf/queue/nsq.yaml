# NSQ任务队列配置示例
# 文件路径: backend/conf/queue/nsq.yaml

# ============================================================
# NSQ基础配置
# ============================================================
nsqd_addresses:
  - "localhost:4150"
  # - "nsqd-2.example.com:4150"  # 集群部署时添加多个NSQD地址

nsqlookupd_addresses:
  - "localhost:4161"
  # - "nsqlookupd-2.example.com:4161"  # 集群部署时添加多个NSQLookupd地址

# ============================================================
# 生产者配置
# ============================================================
producer:
  timeout: 5s              # 发布超时时间
  retry: 3                 # 失败重试次数
  retry_interval: 1s       # 重试间隔
  max_idle_conns: 10       # 最大空闲连接数

# ============================================================
# 消费者配置
# ============================================================
consumer:
  max_retries: 3           # 最大重试次数（超过进入死信队列）
  retry_delay: 1s          # 重试延迟（指数退避初始值）
  max_in_flight: 10        # 最大并发消息数
  message_timeout: 60s     # 消息处理超时
  heartbeat_interval: 30s  # 心跳间隔

# ============================================================
# 死信队列配置
# ============================================================
dlq:
  enabled: true            # 是否启用死信队列
  topic_suffix: "-dlq"     # 死信队列Topic后缀
  retention_duration: 72h  # 死信消息保留时长
  max_replays: 3           # 最大重放次数

# ============================================================
# 监控配置
# ============================================================
metrics:
  enabled: true            # 是否启用Prometheus监控
  address: ":2112"         # Metrics暴露地址

# ============================================================
# 日志配置
# ============================================================
logging:
  level: "info"            # 日志级别（debug, info, warn, error）
  verbose: false           # 是否输出详细日志

