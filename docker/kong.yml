# Kong API Gateway Docker Compose配置

version: '3.8'

services:
  # ========== Kong API Gateway ==========
  kong:
    image: kong:3.4-alpine
    container_name: zker-kong-gateway
    environment:
      # 数据库模式 (开发环境使用off，生产环境使用Postgres)
      KONG_DATABASE: "off"

      # 日志配置
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr

      # 管理接口
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"

      # 代理配置
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_PROXY_LISTEN_SSL: "0.0.0.0:8443"

      # DNS配置 (服务发现)
      KONG_DNS_RESOLVER: "127.0.0.11:53"  # Docker内部DNS
      KONG_DNS_ORDER: "LAST,A,SRV,CNAME"

      # 插件配置
      KONG_PLUGINS: "bundled,rate-limiting,circuit-breaker,jwt,prometheus"

      # 日志级别
      KONG_LOG_LEVEL: "info"
    ports:
      - "8000:8000"   # Proxy HTTP
      - "8443:8443"   # Proxy HTTPS
      - "8001:8001"   # Admin API
      - "8444:8444"   # Admin API SSL
    networks:
      - kong-network
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Konga (Kong管理UI) ==========
  konga:
    image: pantsel/konga:latest
    container_name: zker-konga-ui
    environment:
      NODE_ENV: production
      DB_ADAPTER: postgres
      DB_HOST: konga-postgres
      DB_PORT: 5432
      DB_USER: konga
      DB_PASSWORD: konga_password
      DB_DATABASE: konga
    ports:
      - "1337:1337"
    depends_on:
      - konga-postgres
    networks:
      - kong-network

  # ========== Konga数据库 ==========
  konga-postgres:
    image: postgres:15-alpine
    container_name: zker-konga-postgres
    environment:
      POSTGRES_USER: konga
      POSTGRES_PASSWORD: konga_password
      POSTGRES_DB: konga
    volumes:
      - konga-postgres-data:/var/lib/postgresql/data
    networks:
      - kong-network

  # ========== Prometheus Pushgateway (Kong指标推送) ==========
  pushgateway:
    image: prom/pushgateway:latest
    container_name: zker-pushgateway
    ports:
      - "9091:9091"
    networks:
      - kong-network

networks:
  kong-network:
    driver: bridge

volumes:
  konga-postgres-data:
    driver: local
