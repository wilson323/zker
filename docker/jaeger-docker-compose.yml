# Jaeger Docker Compose配置

version: '3.8'

services:
  # Jaeger All-in-One
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: zker-jaeger
    ports:
      - "5775:5775/udp"       # accept zipkin.thrift over compact thrift
      - "6831:6831/udp"       # accept jaeger.thrift over compact thrift
      - "6832:6832/udp"       # accept jaeger.thrift over binary thrift
      - "5778:5778"           # serve Zipkin compat endpoints
      - "16686:16686"         # Jaeger UI
      - "14268:14268"         # Jaeger Collector HTTP
      - "14250:14250"         # gRPC
      - "9411:9411"           # Admin UI (Graceful shutdown)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=elasticsearch
      - ES_SERVER_URLS=http://elasticsearch:9200
      - ES_TAGS_AS_FIELDS=all
    networks:
      - zker-network
    depends_on:
      - elasticsearch

  # Elasticsearch (用于存储追踪数据)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: zker-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
    networks:
      - zker-network
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

networks:
  zker-network:
    driver: bridge

volumes:
  elasticsearch-data:
    driver: local
