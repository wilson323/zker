# Prometheus企业级配置文件
# ZKER 多租户SaaS系统 - 增强版
# 版本: v2.0.0
# 更新: 2025-01-03

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: 'zker-production'
    environment: 'production'
    datacenter: 'aliyun-cn-hangzhou'
    region: 'cn-east'

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'
      timeout: 10s
      api_version: v2

# 告警规则文件
rule_files:
  - '/etc/prometheus/rules/*.yml'
  - '/etc/prometheus/rules/alerts/*.yml'
  - '/etc/prometheus/rules/slo/*.yml'

# 抓取配置
scrape_configs:
  # ========================================
  # 应用层监控
  # ========================================

  # Coze Studio API主服务
  - job_name: 'zker-backend-api'
    static_configs:
      - targets: ['zker-backend:8888']
        labels:
          service: 'backend-api'
          tier: 'application'
          namespace: 'production'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true
    honor_timestamps: true

  # Coze Studio前端监控
  - job_name: 'zker-frontend'
    static_configs:
      - targets: ['zker-frontend:3000']
        labels:
          service: 'frontend'
          tier: 'presentation'
          namespace: 'production'
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Workflow引擎
  - job_name: 'zker-workflow-engine'
    static_configs:
      - targets: ['zker-workflow:8889']
        labels:
          service: 'workflow-engine'
          tier: 'application'
          namespace: 'production'
    scrape_interval: 10s

  # ========================================
  # 数据库层监控
  # ========================================

  # MySQL主库
  - job_name: 'mysql-master'
    static_configs:
      - targets: ['mysql-exporter-master:9104']
        labels:
          service: 'mysql'
          tier: 'database'
          role: 'master'
          cluster: 'mysql-cluster'
    scrape_interval: 30s

  # MySQL从库
  - job_name: 'mysql-slave'
    static_configs:
      - targets: ['mysql-exporter-slave:9104']
        labels:
          service: 'mysql'
          tier: 'database'
          role: 'slave'
          cluster: 'mysql-cluster'
    scrape_interval: 30s

  # ========================================
  # 缓存层监控
  # ========================================

  # Redis集群
  - job_name: 'redis-cluster'
    static_configs:
      - targets:
          - 'redis-exporter-node-1:9121'
          - 'redis-exporter-node-2:9121'
          - 'redis-exporter-node-3:9121'
        labels:
          service: 'redis'
          tier: 'cache'
          cluster: 'redis-cluster'
    scrape_interval: 30s

  # Redis Sentinel
  - job_name: 'redis-sentinel'
    static_configs:
      - targets:
          - 'redis-sentinel-exporter:9121'
        labels:
          service: 'redis-sentinel'
          tier: 'cache'
    scrape_interval: 30s

  # ========================================
  # 搜索引擎监控
  # ========================================

  # Elasticsearch集群
  - job_name: 'elasticsearch-cluster'
    static_configs:
      - targets:
          - 'elasticsearch-exporter:9114'
        labels:
          service: 'elasticsearch'
          tier: 'search'
          cluster: 'es-cluster'
    scrape_interval: 30s

  # ========================================
  # 消息队列监控
  # ========================================

  # RabbitMQ
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq-exporter:9090']
        labels:
          service: 'rabbitmq'
          tier: 'message-queue'
          cluster: 'rabbitmq-cluster'
    scrape_interval: 30s

  # Kafka
  - job_name: 'kafka'
    static_configs:
      - targets:
          - 'kafka-exporter:9308'
        labels:
          service: 'kafka'
          tier: 'message-queue'
          cluster: 'kafka-cluster'
    scrape_interval: 30s

  # ========================================
  # 中间件监控
  # ========================================

  # Nginx Ingress
  - job_name: 'nginx-ingress'
    static_configs:
      - targets: ['nginx-prometheus-exporter:9113']
        labels:
          service: 'nginx-ingress'
          tier: 'gateway'
    scrape_interval: 15s

  # ========================================
  # 系统层监控
  # ========================================

  # Node Exporter - 所有节点
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter-1:9100'
          - 'node-exporter-2:9100'
          - 'node-exporter-3:9100'
        labels:
          service: 'node-exporter'
          tier: 'infrastructure'
    scrape_interval: 30s

  # cAdvisor - 容器监控
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          tier: 'container'
    scrape_interval: 30s

  # ========================================
  # 监控系统自监控
  # ========================================

  # Prometheus自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          tier: 'monitoring'
    scrape_interval: 30s

  # AlertManager
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: 'alertmanager'
          tier: 'monitoring'
    scrape_interval: 30s

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
          tier: 'monitoring'
    scrape_interval: 30s

  # ========================================
  # 业务指标采集
  # ========================================

  # 自定义业务指标
  - job_name: 'zker-business-metrics'
    static_configs:
      - targets: ['zker-backend:8888']
        labels:
          service: 'business-metrics'
          tier: 'application'
    metrics_path: '/metrics/business'
    scrape_interval: 60s

# 远程写入配置（可选，用于长期存储）
# remote_write:
