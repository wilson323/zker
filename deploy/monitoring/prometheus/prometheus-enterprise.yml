# 存储配置
storage:
  tsdb:
    path: /prometheus/data
    retentions:
      - name: "raw"
        duration: 15d
        resolution: 1s
      - name: "5m"
        duration: 30d
        resolution: 5m
      - name: "1h"
        duration: 90d
        resolution: 1h
