# ZKER 企业级告警规则
# 多租户SaaS系统监控告警配置

groups:
  # ========== API性能告警 ==========
  - name: zker_api_alerts
    interval: 30s
    rules:
      # 高错误率告警
      - alert: HighAPIErrorRate
        expr: |
          sum(rate(coze_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(coze_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          category: api
        annotations:
          summary: "API错误率过高"
          description: "过去5分钟错误率为 {{ $value | humanizePercentage }}"
          runbook_url: "https://docs.coze-studio.com/runbooks/api-errors"

      # API高延迟告警
      - alert: HighAPILatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(coze_http_request_duration_seconds_bucket[5m])) by (le, endpoint)
          ) > 1
        for: 10m
        labels:
          severity: warning
          category: api
        annotations:
          summary: "API响应延迟过高"
          description: "P95延迟为 {{ $value }}s，持续10分钟"
          runbook_url: "https://docs.coze-studio.com/runbooks/high-latency"

      # API QPS突降告警
      - alert: LowAPIQPS
        expr: |
          sum(rate(coze_http_requests_total[5m])) < 10
        for: 5m
        labels:
          severity: warning
          category: api
        annotations:
          summary: "API请求量异常下降"
          description: "当前QPS为 {{ $value }}，低于基线"

  # ========== 数据库告警 ==========
  - name: zker_database_alerts
    interval: 30s
    rules:
      # 慢查询告警
      - alert: SlowDatabaseQuery
        expr: |
          histogram_quantile(0.95,
            sum(rate(db_query_duration_seconds_bucket[5m])) by (le, table)
          ) > 0.5
        for: 15m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "数据库慢查询过多"
          description: "表 {{ $labels.table }} 的P95查询延迟为 {{ $value }}s"
          runbook_url: "https://docs.coze-studio.com/runbooks/slow-query"

      # 数据库连接池告警
      - alert: DatabaseConnectionPoolHigh
        expr: |
          db_connections_active / db_connections_max > 0.9
        for: 10m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "数据库连接池接近满载"
          description: "连接池使用率为 {{ $value | humanizePercentage }}"

      # 数据库连接失败告警
      - alert: DatabaseConnectionFailure
        expr: |
          increase(db_connection_errors_total[5m]) > 10
        for: 5m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "数据库连接失败"
          description: "过去5分钟有 {{ $value }} 次连接失败"

  # ========== 缓存告警 ==========
  - name: zker_cache_alerts
    interval: 30s
    rules:
      # 缓存命中率低
      - alert: LowCacheHitRate
        expr: |
          sum(rate(cache_hit_total[5m])) by (cache_type)
          /
          (sum(rate(cache_hit_total[5m])) by (cache_type) + sum(rate(cache_miss_total[5m])) by (cache_type))
          < 0.8
        for: 20m
        labels:
          severity: info
          category: cache
        annotations:
          summary: "缓存命中率低"
          description: "缓存 {{ $labels.cache_type }} 命中率为 {{ $value | humanizePercentage }}"
          runbook_url: "https://docs.coze-studio.com/runbooks/low-cache-hit"

      # 缓存操作延迟高
      - alert: HighCacheLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(cache_duration_seconds_bucket[5m])) by (le, cache_type)
          ) > 0.01
        for: 15m
        labels:
          severity: warning
          category: cache
        annotations:
          summary: "缓存操作延迟过高"
          description: "缓存 {{ $labels.cache_type }} P95延迟为 {{ $value }}s"

  # ========== 租户告警 ==========
  - name: zker_tenant_alerts
    interval: 1m
    rules:
      # 租户配额超限
      - alert: TenantQuotaExceeded
        expr: |
          quota_usage{tenant_id!="unknown"} > quota_limit
        for: 5m
        labels:
          severity: warning
          category: tenant
        annotations:
          summary: "租户配额超限"
          description: "租户 {{ $labels.tenant_id }} 的 {{ $labels.resource_type }} 配额已超限"
          runbook_url: "https://docs.coze-studio.com/runbooks/quota-exceeded"

      # 租户配额即将耗尽 (90%)
      - alert: TenantQuotaNearLimit
        expr: |
          quota_usage{tenant_id!="unknown"} / quota_limit > 0.9
        for: 10m
        labels:
          severity: info
          category: tenant
        annotations:
          summary: "租户配额即将耗尽"
          description: "租户 {{ $labels.tenant_id }} 的 {{ $labels.resource_type }} 配额已使用 {{ $value | humanizePercentage }}"

      # 订阅即将过期
      - alert: SubscriptionExpiringSoon
        expr: |
          subscription_days_until_expiry{tenant_id!="unknown"} <= 7
        for: 1h
        labels:
          severity: warning
          category: tenant
        annotations:
          summary: "订阅即将过期"
          description: "租户 {{ $labels.tenant_id }} 的订阅将在 {{ $value }} 天后过期"

  # ========== 业务告警 ==========
  - name: zker_business_alerts
    interval: 1m
    rules:
      # Bot执行失败率过高
      - alert: HighBotFailureRate
        expr: |
          sum(rate(bot_invocation_total{status="failed"}[5m])) by (tenant_id)
          /
          sum(rate(bot_invocation_total[5m])) by (tenant_id) > 0.1
        for: 10m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "Bot执行失败率过高"
          description: "租户 {{ $labels.tenant_id }} 的Bot失败率为 {{ $value | humanizePercentage }}"

      # 工作流执行延迟过高
      - alert: HighWorkflowExecutionTime
        expr: |
          histogram_quantile(0.95,
            sum(rate(workflow_execution_duration_seconds_bucket[5m])) by (le)
          ) > 30
        for: 15m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "工作流执行时间过长"
          description: "P95工作流执行时间为 {{ $value }}s"

      # 活跃用户数异常下降
      - alert: ActiveUsersDrop
        expr: |
          active_users_total < 100
        for: 15m
        labels:
          severity: info
          category: business
        annotations:
          summary: "活跃用户数异常下降"
          description: "当前活跃用户数为 {{ $value }}"

  # ========== 系统资源告警 ==========
  - name: zker_system_alerts
    interval: 30s
    rules:
      # CPU使用率过高
      - alert: HighCPUUsage
        expr: |
          sum(rate(process_cpu_seconds_total{mode!="idle"}[5m])) by (instance) > 0.8
        for: 15m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "CPU使用率过高"
          description: "实例 {{ $labels.instance }} CPU使用率为 {{ $value | humanizePercentage }}"

      # 内存使用率过高
      - alert: HighMemoryUsage
        expr: |
          process_resident_memory_bytes / node_memory_MemTotal_bytes > 0.9
        for: 10m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "内存使用率过高"
          description: "实例 {{ $labels.instance }} 内存使用率为 {{ $value | humanizePercentage }}"

      # 磁盘空间不足
      - alert: LowDiskSpace
        expr: |
          node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.1
        for: 10m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "磁盘空间不足"
          description: "挂载点 {{ $labels.mountpoint }} 剩余空间少于10%"

      # Goroutine数量过多
      - alert: HighGoroutineCount
        expr: |
          sys_goroutines_count > 10000
        for: 15m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "Goroutine数量过多"
          description: "当前Goroutine数量为 {{ $value }}"

  # ========== 权限告警 ==========
  - name: zker_permission_alerts
    interval: 1m
    rules:
      # 权限拒绝率过高
      - alert: HighPermissionDenialRate
        expr: |
          sum(rate(permission_denied_total[5m])) by (tenant_id)
          /
          sum(rate(permission_check_total[5m])) by (tenant_id) > 0.1
        for: 10m
        labels:
          severity: warning
          category: permission
        annotations:
          summary: "权限拒绝率过高"
          description: "租户 {{ $labels.tenant_id }} 权限拒绝率为 {{ $value | humanizePercentage }}"
          runbook_url: "https://docs.coze-studio.com/runbooks/permission-denied"

  # ========== 知识库告警 ==========
  - name: zker_knowledge_alerts
    interval: 1m
    rules:
      # 知识库搜索延迟过高
      - alert: HighKnowledgeSearchLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(knowledge_search_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 10m
        labels:
          severity: warning
          category: knowledge
        annotations:
          summary: "知识库搜索延迟过高"
          description: "P95知识库搜索延迟为 {{ $value }}s"

      # 知识库索引失败
      - alert: KnowledgeIndexFailure
        expr: |
          increase(knowledge_index_errors_total[10m]) > 5
        for: 5m
        labels:
          severity: warning
          category: knowledge
        annotations:
          summary: "知识库索引失败"
          description: "过去10分钟有 {{ $value }} 次索引失败"

  # ========== 工作流告警 ==========
  - name: zker_workflow_alerts
    interval: 30s
    rules:
      # 工作流执行失败率过高
      - alert: HighWorkflowFailureRate
        expr: |
          sum(rate(workflow_execution_total{status="failed"}[5m]))
          /
          sum(rate(workflow_execution_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
          category: workflow
        annotations:
          summary: "工作流失败率过高"
          description: "工作流失败率为 {{ $value | humanizePercentage }}"

      # 工作流节点执行卡住
      - alert: WorkflowNodeStuck
        expr: |
          time() - workflow_node_start_timestamp > 300
        for: 5m
        labels:
          severity: warning
          category: workflow
        annotations:
          summary: "工作流节点执行超时"
          description: "节点 {{ $labels.node_id }} 执行时间超过5分钟"
