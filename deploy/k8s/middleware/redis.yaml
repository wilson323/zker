# ================================================================================
# Coze Studio - Redis StatefulSet & Service (哨兵模式高可用)
# ================================================================================
# 用途：缓存和会话存储
# 架构：Redis Master + Slave + Sentinel（哨兵自动故障转移）
# 存储：PVC 持久化
# 作者：ZKER DevOps Team
# 创建时间：2025-01-01
# ================================================================================

---
# ================================================================================
# Redis ConfigMap
# ================================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: coze-studio
data:
  redis.conf: |
    # 绑定地址
    bind 0.0.0.0

    # 端口
    port 6379

    # 持久化配置
    save 900 1
    save 300 10
    save 60 10000

    # AOF 持久化
    appendonly yes
    appendfsync everysec

    # 最大内存
    maxmemory 2gb
    maxmemory-policy allkeys-lru

    # 慢查询日志
    slowlog-log-slower-than 10000
    slowlog-max-len 128

  sentinel.conf: |
    sentinel monitor mymaster redis-master 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel parallel-syncs mymaster 1
    sentinel failover-timeout mymaster 10000
    sentinel auth-pass mymaster {{ .Values.redis.password }}

---
# ================================================================================
# Redis Master StatefulSet
# ================================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-master
  namespace: coze-studio
  labels:
    app: coze-studio
    component: redis
    role: master
spec:
  serviceName: redis-master
  replicas: 1
  selector:
    matchLabels:
      app: coze-studio
      component: redis
      role: master
  template:
    metadata:
      labels:
        app: coze-studio
        component: redis
        role: master
    spec:
      containers:
      - name: redis
        image: redis:8.0
        command:
        - redis-server
        - /etc/redis/redis.conf
        - --requirepass
        - $(REDIS_PASSWORD)
        - --masterauth
        - $(REDIS_PASSWORD)
        ports:
        - name: redis
          containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: coze-studio-secret
              key: redis-password
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/redis
          readOnly: true
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          exec:
            command:
            - redis-cli
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: redis-config
          items:
          - key: redis.conf
            path: redis.conf
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 50Gi

---
# ================================================================================
# Redis Slave StatefulSet
# ================================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-slave
  namespace: coze-studio
  labels:
    app: coze-studio
    component: redis
    role: slave
spec:
  serviceName: redis-slave
  replicas: 2
  selector:
    matchLabels:
      app: coze-studio
      component: redis
      role: slave
  template:
    metadata:
      labels:
        app: coze-studio
        component: redis
        role: slave
    spec:
      containers:
      - name: redis
        image: redis:8.0
        command:
        - redis-server
        - /etc/redis/redis.conf
        - --slaveof
        - redis-master
        - "6379"
        - --requirepass
        - $(REDIS_PASSWORD)
        - --masterauth
        - $(REDIS_PASSWORD)
        ports:
        - name: redis
          containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: coze-studio-secret
              key: redis-password
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/redis
          readOnly: true
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
      volumes:
      - name: config
        configMap:
          name: redis-config
          items:
          - key: redis.conf
            path: redis.conf
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 50Gi

---
# ================================================================================
# Redis Sentinel Deployment（哨兵）
# ================================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-sentinel
  namespace: coze-studio
  labels:
    app: coze-studio
    component: redis
    role: sentinel
spec:
  replicas: 3
  selector:
    matchLabels:
      app: coze-studio
      component: redis
      role: sentinel
  template:
    metadata:
      labels:
        app: coze-studio
        component: redis
        role: sentinel
    spec:
      containers:
      - name: sentinel
        image: redis:8.0
        command:
        - redis-sentinel
        - /etc/redis/sentinel.conf
        ports:
        - name: sentinel
          containerPort: 26379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: coze-studio-secret
              key: redis-password
        volumeMounts:
        - name: config
          mountPath: /etc/redis
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: redis-config

---
# ================================================================================
# Services
# ================================================================================
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: coze-studio
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: coze-studio
    component: redis
    role: master
  ports:
  - port: 6379
    targetPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: redis-slave
  namespace: coze-studio
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: coze-studio
    component: redis
    role: slave
  ports:
  - port: 6379
    targetPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: coze-studio
spec:
  type: ClusterIP
  selector:
    app: coze-studio
    component: redis
    role: slave
  ports:
  - port: 6379
    targetPort: 6379

---
# ================================================================================
# PodDisruptionBudget
# ================================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: coze-studio
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: coze-studio
      component: redis
