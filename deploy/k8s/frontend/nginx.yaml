# ================================================================================
# Coze Studio - Frontend Nginx Deployment & Service
# ================================================================================
# 用途：前端静态资源服务器（React 应用）
# 架构：无状态服务，通过 Nginx 提供静态文件和 API 反向代理
# 资源配置：支持水平扩展
# 作者：ZKER DevOps Team
# 创建时间：2025-01-01
# ================================================================================

---
# ================================================================================
# Frontend Deployment
# ================================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coze-studio-frontend
  namespace: coze-studio
  labels:
    app: coze-studio
    component: frontend
    version: v1
  annotations:
    description: "Coze Studio 前端 Nginx 服务器"
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: coze-studio
      component: frontend
  template:
    metadata:
      labels:
        app: coze-studio
        component: frontend
        version: v1
    spec:
      containers:
      - name: nginx
        image: coze-studio/frontend:latest  # 替换为实际镜像地址
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 80
          protocol: TCP

        # 环境变量（可选，用于动态配置）
        env:
        - name: API_SERVER_URL
          value: "http://coze-studio-api.coze-studio.svc.cluster.local:8888"
        - name: ENVIRONMENT
          value: "production"

        # 资源配置
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        # 健康检查
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        # 卷挂载（可选：自定义 Nginx 配置）
        # volumeMounts:
        # - name: nginx-config
        #   mountPath: /etc/nginx/conf.d/default.conf
        #   subPath: default.conf

      # 卷定义
      # volumes:
      # - name: nginx-config
      #   configMap:
      #     name: nginx-config

      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
# ================================================================================
# Frontend Service (LoadBalancer)
# ================================================================================
apiVersion: v1
kind: Service
metadata:
  name: coze-studio-frontend
  namespace: coze-studio
  labels:
    app: coze-studio
    component: frontend
  annotations:
    description: "Coze Studio 前端服务（LoadBalancer）"
    # 如果使用云厂商的 LoadBalancer，可以添加注解
    # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # service.beta.kubernetes.io/alibaba-cloud-loadbalancer-spec: "slb.s3.small"
spec:
  type: LoadBalancer  # 或 ClusterIP（如果使用 Ingress）
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  selector:
    app: coze-studio
    component: frontend
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
    # 如果使用 LoadBalancer 且有外部 HTTPS，可以添加
    # nodePort: 30080

---
