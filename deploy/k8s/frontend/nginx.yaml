---
# ================================================================================
# PodDisruptionBudget
# ================================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coze-studio-frontend-pdb
  namespace: coze-studio
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: coze-studio
      component: frontend

---
# ================================================================================
# HorizontalPodAutoscaler
# ================================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coze-studio-frontend-hpa
  namespace: coze-studio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coze-studio-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30

---
