# ================================================================================
# Coze Studio - 敏感配置 Secret 模板
# ================================================================================
# 用途：存储所有敏感信息（密码、API密钥、证书等）
# 安全说明：
#   1. 所有值必须使用 base64 编码
#   2. 生产环境应使用 External Secrets Operator 从 Vault/AWS Secrets Manager 同步
#   3. 启用 RBAC 限制访问权限
#   4. 定期轮换密钥
#
# Base64 编码命令示例：
#   echo -n "your_password" | base64
#
# Base64 解码命令示例：
#   echo "your_base64_string" | base64 -d
#
# 作者：ZKER DevOps Team
# 创建时间：2025-01-01
# ================================================================================

apiVersion: v1
kind: Secret
metadata:
  name: coze-studio-secret
  namespace: coze-studio
  labels:
    app: coze-studio
    component: secret
type: Opaque
data:
  # ==============================================================================
  # 数据库密码（必须修改！）
  # ==============================================================================
  # 示例：echo -n "CozeStudio@2025" | base64
  db-password: "YOUR_BASE64_ENCODED_PASSWORD_HERE"

  # 数据库 Root 密码
  db-root-password: "YOUR_BASE64_ENCODED_ROOT_PASSWORD_HERE"

  # ==============================================================================
  # Redis 密码
  # ==============================================================================
  redis-password: "YOUR_BASE64_ENCODED_REDIS_PASSWORD_HERE"

  # ==============================================================================
  # MinIO 凭证
  # ==============================================================================
  minio-access-key: "YOUR_BASE64_ENCODED_MINIO_ACCESS_KEY_HERE"
  minio-secret-key: "YOUR_BASE64_ENCODED_MINIO_SECRET_KEY_HERE"

  # ==============================================================================
  # AI 模型 API 密钥
  # ==============================================================================
  # OpenAI API Key
  openai-api-key: "YOUR_BASE64_ENCODED_OPENAI_KEY_HERE"

  # Azure OpenAI API Key
  azure-openai-api-key: "YOUR_BASE64_ENCODED_AZURE_OPENAI_KEY_HERE"

  # ==============================================================================
  # 第三方服务凭证
  # ==============================================================================
  # GitHub Token（用于 CI/CD）
  github-token: "YOUR_BASE64_ENCODED_GITHUB_TOKEN_HERE"

  # Docker Registry 凭证
  docker-registry-username: "YOUR_BASE64_ENCODED_DOCKER_USERNAME_HERE"
  docker-registry-password: "YOUR_BASE64_ENCODED_DOCKER_PASSWORD_HERE"

  # ==============================================================================
  # JWT 签名密钥
  # ==============================================================================
  jwt-signing-key: "YOUR_BASE64_ENCODED_JWT_KEY_HERE"

  # ==============================================================================
  # 加密密钥（数据加密）
  # ==============================================================================
  encryption-key: "YOUR_BASE64_ENCODED_ENCRYPTION_KEY_HERE"

  # ==============================================================================
  # OAuth 凭证（如果使用）
  # ==============================================================================
  oauth-client-id: "YOUR_BASE64_ENCODED_OAUTH_CLIENT_ID_HERE"
  oauth-client-secret: "YOUR_BASE64_ENCODED_OAUTH_CLIENT_SECRET_HERE"

  # ==============================================================================
  # SMTP 邮件服务配置
  # ==============================================================================
  smtp-host: "YOUR_BASE64_ENCODED_SMTP_HOST_HERE"
  smtp-port: "YOUR_BASE64_ENCODED_SMTP_PORT_HERE"
  smtp-username: "YOUR_BASE64_ENCODED_SMTP_USERNAME_HERE"
  smtp-password: "YOUR_BASE64_ENCODED_SMTP_PASSWORD_HERE"

  # ==============================================================================
  # TLS/SSL 证书（如果使用自签名证书）
  # ==============================================================================
  # tls-cert: "YOUR_BASE64_ENCODED_TLS_CERT_HERE"
  # tls-key: "YOUR_BASE64_ENCODED_TLS_KEY_HERE"

---
# ================================================================================
# 生产环境 Secret（使用 External Secrets Operator）
# ================================================================================
# 说明：生产环境应使用 External Secrets Operator 从安全的密钥管理服务同步
# 示例配置（需要安装 External Secrets Operator）：
#
# apiVersion: external-secrets.io/v1beta1
# kind: SecretStore
# metadata:
#   name: vault-backend
#   namespace: coze-studio
# spec:
#   provider:
#     vault:
#       server: "https://vault.company.com"
#       path: "secret"
#       auth:
#         tokenSecretRef:
#           name: vault-token
#           key: token
#
# ---
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: coze-studio-secret
#   namespace: coze-studio
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: vault-backend
#     kind: SecretStore
#   target:
#     name: coze-studio-secret
#     creationPolicy: Owner
#   data:
#     - secretKey: db-password
#       remoteRef:
#         key: coze-studio/db-password
#     - secretKey: redis-password
#       remoteRef:
#         key: coze-studio/redis-password
