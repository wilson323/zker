---
# ================================================================================
# PodDisruptionBudget (保障高可用)
# ================================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coze-studio-api-pdb
  namespace: coze-studio
  labels:
    app: coze-studio
    component: api-server
spec:
  # 最少保持 2 个可用 Pod
  minAvailable: 2
  selector:
    matchLabels:
      app: coze-studio
      component: api-server

---
# ================================================================================
# HorizontalPodAutoscaler (自动扩展)
# ================================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coze-studio-api-hpa
  namespace: coze-studio
  labels:
    app: coze-studio
    component: api-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coze-studio-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
  # CPU 使用率
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # 内存使用率
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  # 自定义指标：QPS
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "1000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 分钟稳定窗口
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
      selectPolicy: Max
