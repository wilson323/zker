# Kubernetes部署清单 - 租户服务
apiVersion: v1
kind: Namespace
metadata:
  name: coze-studio
  labels:
    name: coze-studio

---
# 租户服务Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-service
  namespace: coze-studio
  labels:
    app: tenant-service
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tenant-service
  template:
    metadata:
      labels:
        app: tenant-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: tenant-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: tenant-service
        image: coze-studio/tenant-service:v1.0.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8001
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        - name: health
          containerPort: 8080
          protocol: TCP
        env:
        - name: SERVICE_NAME
          value: "tenant-service"
        - name: SERVICE_PORT
          value: "8001"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: port
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: database
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: redis-config
              key: host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: redis-config
              key: port
        - name: CONSUL_ADDR
          valueFrom:
            configMapKeyRef:
              name: consul-config
              key: address
        - name: JAEGER_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: tracing-config
              key: jaeger_endpoint
        - name: LOG_LEVEL
          value: "info"
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: health
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: health
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - tenant-service
              topologyKey: kubernetes.io/hostname

---
# 租户服务Service
apiVersion: v1
kind: Service
metadata:
  name: tenant-service
  namespace: coze-studio
  labels:
    app: tenant-service
  annotations:
    prometheus.io/scrape: "true"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8001
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app: tenant-service

---
# 租户服务ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-service
  namespace: coze-studio

---
# 租户服务ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-config
  namespace: coze-studio
data:
  service.yaml: |
    server:
      port: 8001
      mode: release
    log:
      level: info
      encoding: json
      output_paths:
        - stdout
      error_output_paths:
        - stderr
    tenant:
      max_bots:
        free: 3
        basic: 10
        premium: 50
        enterprise: 500
      max_users:
        free: 5
        basic: 20
        premium: 100
        enterprise: 1000

---
# 租户服务HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tenant-service-hpa
  namespace: coze-studio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tenant-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max

---
# 租户服务PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tenant-service-pdb
  namespace: coze-studio
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: tenant-service

---
# 租户服务Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tenant-service-ingress
  namespace: coze-studio
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - api.coze-studio.com
    secretName: coze-studio-tls
  rules:
  - host: api.coze-studio.com
    http:
      paths:
      - path: /api/v1/tenants
        pathType: Prefix
        backend:
          service:
            name: tenant-service
            port:
              number: 8001
