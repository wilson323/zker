# Kustomize 基础配置
# 用途: 定义所有环境共享的基础资源
# 遵循规范: Kustomize 最佳实践 + DRY 原则

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 命名空间
namespace: zker

# 基础资源
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml

# 标签 (所有资源)
commonLabels:
  app.kubernetes.io/name: zker
  app.kubernetes.io/instance: zker-production
  app.kubernetes.io/managed-by: kustomize

# 配置图生成器 (从文件生成)
configMapGenerator:
  - name: zker-version-config
    literals:
      - VERSION=v1.0.0
      - BUILD_DATE=2025-01-01
      - GIT_COMMIT=unknown

# 密钥生成器 (从文件生成,生产环境从外部注入)
