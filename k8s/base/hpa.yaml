# HPA 配置 - Horizontal Pod Autoscaler
# 用途: 根据 CPU/内存使用率自动扩展 Pod 数量
# 遵循规范: K8s HPA 最佳实践 + 企业级自动扩展策略

---
# API HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zker-api-hpa
  namespace: zker
  labels:
    app: zker-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zker-api

  # 最小和最大副本数
  minReplicas: 3
  maxReplicas: 10

  # 指标配置
  metrics:
  # CPU 使用率
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

  # 内存使用率
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

  # 自定义指标 (可选,需要安装 Prometheus Adapter)
  # - type: Pods
  #   pods:
  #     metric:
  #       name: http_requests_per_second
  #     target:
  #       type: AverageValue
  #       averageValue: "100"

  # 行为配置
  behavior:
    # 扩展策略
    scaleUp:
      stabilizationWindowSeconds: 60  # 稳定窗口 60 秒
      policies:
      - type: Percent
        value: 50  # 每次最多增加 50%
        periodSeconds: 60
      - type: Pods
        value: 2  # 每次最多增加 2 个 Pod
        periodSeconds: 60
      selectPolicy: Max  # 使用较大的值

    # 缩容策略
    scaleDown:
      stabilizationWindowSeconds: 300  # 稳定窗口 5 分钟
      policies:
      - type: Percent
        value: 10  # 每次最多减少 10%
        periodSeconds: 60
      - type: Pods
        value: 1  # 每次最多减少 1 个 Pod
        periodSeconds: 60
      selectPolicy: Min  # 使用较小的值

---
# Frontend HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zker-frontend-hpa
  namespace: zker
  labels:
    app: zker-frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zker-frontend

  minReplicas: 2
  maxReplicas: 5

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Min
