# Secret 配置 - ZKER 敏感信息
# 用途: 存储敏感配置信息 (密码、密钥等)
# 遵循规范: K8s Secret 最佳实践 + 最小权限原则

---
# 数据库 Secret
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: zker
  labels:
    app: zker
type: Opaque
stringData:
  host: "zker-mysql.zker.svc.cluster.local"
  port: "3306"
  user: "zker"
  password: "CHANGE_ME_SECURE_PASSWORD"
  database: "zker"

---
# API 密钥 Secret
apiVersion: v1
kind: Secret
metadata:
  name: api-keys
  namespace: zker
  labels:
    app: zker
type: Opaque
stringData:
  # OpenAI API Key
  openai-api-key: "CHANGE_ME_OPENAI_KEY"

  # Anthropic API Key
  anthropic-api-key: "CHANGE_ME_ANTHROPIC_KEY"

  # Google AI Key
  google-ai-key: "CHANGE_ME_GOOGLE_AI_KEY"

---
# JWT Secret
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: zker
  labels:
    app: zker
type: Opaque
stringData:
  secret: "CHANGE_ME_JWT_SECRET_MIN_32_CHARS"
  expiration: "86400"  # 24 hours

---
# MinIO Secret
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: zker
  labels:
    app: zker
type: Opaque
stringData:
  access-key: "minioadmin"
  secret-key: "CHANGE_ME_MINIO_SECRET"

---
# OAuth Secret (第三方登录)
apiVersion: v1
kind: Secret
metadata:
  name: oauth-secret
  namespace: zker
  labels:
    app: zker
type: Opaque
stringData:
  # GitHub OAuth
  github-client-id: "CHANGE_ME_GITHUB_CLIENT_ID"
  github-client-secret: "CHANGE_ME_GITHUB_CLIENT_SECRET"

  # Google OAuth
  google-client-id: "CHANGE_ME_GOOGLE_CLIENT_ID"
  google-client-secret: "CHANGE_ME_GOOGLE_CLIENT_SECRET"

---
# Webhook Secret
apiVersion: v1
kind: Secret
metadata:
  name: webhook-secret
  namespace: zker
  labels:
    app: zker
type: Opaque
stringData:
  secret: "CHANGE_ME_WEBHOOK_SECRET"

---
# SMTP Secret (邮件服务)
apiVersion: v1
kind: Secret
metadata:
  name: smtp-secret
  namespace: zker
  labels:
    app: zker
type: Opaque
stringData:
  host: "smtp.example.com"
  port: "587"
  username: "noreply@example.com"
  password: "CHANGE_ME_SMTP_PASSWORD"
  from: "ZKER <noreply@example.com>"

---
