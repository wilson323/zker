# Kubernetes部署清单 - 配额服务
apiVersion: v1
kind: Namespace
metadata:
  name: coze-studio
  labels:
    name: coze-studio

---
# 配额服务Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-service
  namespace: coze-studio
  labels:
    app: quota-service
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: quota-service
  template:
    metadata:
      labels:
        app: quota-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: quota-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: quota-service
        image: coze-studio/quota-service:v1.0.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8002
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        - name: health
          containerPort: 8080
          protocol: TCP
        env:
        - name: SERVICE_NAME
          value: "quota-service"
        - name: SERVICE_PORT
          value: "8002"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: port
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: database
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: redis-config
              key: host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: redis-config
              key: port
        - name: CONSUL_ADDR
          valueFrom:
            configMapKeyRef:
              name: consul-config
              key: address
        - name: JAEGER_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: tracing-config
              key: jaeger_endpoint
        - name: LOG_LEVEL
          value: "info"
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: health
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: health
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - quota-service
              topologyKey: kubernetes.io/hostname

---
# 配额服务Service
apiVersion: v1
kind: Service
metadata:
  name: quota-service
  namespace: coze-studio
  labels:
    app: quota-service
  annotations:
    prometheus.io/scrape: "true"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8002
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app: quota-service

---
# 配额服务ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quota-service
  namespace: coze-studio

---
# 配额服务ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: quota-config
  namespace: coze-studio
data:
  service.yaml: |
    server:
      port: 8002
      mode: release
    log:
      level: info
      encoding: json
    quota:
      # 套餐配额限制
      limits:
        free:
          bots: 3
          knowledge_bases: 1
          api_calls_per_day: 1000
          storage_gb: 1
        basic:
          bots: 10
          knowledge_bases: 5
          api_calls_per_day: 10000
          storage_gb: 10
        premium:
          bots: 50
          knowledge_bases: 20
          api_calls_per_day: 100000
          storage_gb: 100
        enterprise:
          bots: 500
          knowledge_bases: 100
          api_calls_per_day: 1000000
          storage_gb: 1000
      # 重置周期
      reset_period: monthly
      # 重置日期（每月1号）
      reset_day: 1

---
# 配额服务HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quota-service-hpa
  namespace: coze-studio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quota-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# 配额服务PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: quota-service-pdb
  namespace: coze-studio
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: quota-service

---
# 配额ServiceMonitor（Prometheus Operator）
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: quota-service
  namespace: coze-studio
  labels:
    app: quota-service
spec:
  selector:
    matchLabels:
      app: quota-service
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
