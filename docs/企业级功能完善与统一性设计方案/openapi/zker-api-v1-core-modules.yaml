                  title: "新对话"
              with_bot:
                summary: 创建并关联 Bot
                value:
                  title: "客服咨询"
                  bot_id: "bot_123"
                  initial_message: "你好,我需要帮助"

      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ConversationDetail'

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Bot 不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    code: "BOT300"

        '422':
          description: 配额超限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                quota_exceeded:
                  value:
                    code: "CONV400"
                    message: "会话数量超过租户配额,请升级订阅方案"

