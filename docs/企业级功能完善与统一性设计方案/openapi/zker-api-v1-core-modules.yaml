              examples:
                not_found:
                  value:
                    code: "BOT300"

        '409':
          description: Bot 已发布
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                published:
                  summary: Bot 已发布,不能修改
                  value:
                    code: "BOT501"
                    message: "Bot 已发布,无法修改,请创建新版本"

    delete:
      tags:
        - Bots
      summary: 删除 Bot
      description: |
        删除指定 Bot (软删除)

        **权限要求**:
        - Bot 所有者
        - 管理员

        **业务规则**:
        - 软删除,设置 deleted_at 字段
        - Bot 的所有关联数据也会被软删除
        - 已发布的 Bot 需要先下线才能删除

      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: string

      responses:
        '200':
          description: 删除成功
          content:
            application/json:
