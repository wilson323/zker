        获取指定 Bot 的详细信息

        **权限要求**:
        - Bot 所有者
        - Bot 协作者
        - 管理员

      parameters:
        - name: bot_id
          in: path
          required: true
          description: Bot ID
          schema:
            type: string

      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BotDetail'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          description: Bot 不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    code: "BOT300"

    put:
      tags:
        - Bots
      summary: 更新 Bot
      description: |
        更新 Bot 信息

        **权限要求**:
        - Bot 所有者
        - 管理员

        **业务规则**:
        - 已发布的 Bot 不能直接修改,需要创建新版本
        - Bot 名称修改后仍需保持唯一性

      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBotRequest'
            examples:
              basic:
                summary: 基础信息更新
                value:
                  name: "客服助手 v2"
                  description: "智能客服助手 - 升级版"
              config:
                summary: 配置更新
                value:
                  model_config:
                    model_id: "gpt-4-turbo"
                    temperature: 0.8
                    max_tokens: 4000
                  prompt_config:
                    system_prompt: "你是一个专业的客服助手..."
                    welcome_message: "您好,有什么可以帮助您的?"

      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BotDetail'

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
