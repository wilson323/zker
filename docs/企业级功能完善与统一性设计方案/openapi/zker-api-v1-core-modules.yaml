openapi: 3.0.3
info:
  title: ZKER API Specification
  version: 1.0.0
  description: |
    ZKER 一站式 AI Agent 开发平台 API 规范

    ## 认证方式

    所有 API (除了登录/注册)都需要在 Header 中携带 JWT Token:

    ```
    Authorization: Bearer <access_token>
    ```

    ## 租户隔离

    所有 API (除了租户管理)都需要在 Header 中携带租户 ID:

    ```
    X-Tenant-ID: <tenant_id>
    ```

    ## 错误码

    统一错误码格式: `{模块}{类型}{编号}`，详见[错误码规范](./ZKER-统一错误码定义规范.md)

  contact:
    name: ZKER API Team
    email: api@zker.com

  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8001
    description: 本地开发环境
  - url: https://api-dev.zker.com
    description: 开发环境
  - url: https://api-staging.zker.com
    description: 测试环境
  - url: https://api.zker.com
    description: 生产环境

tags:
  - name: Authentication
    description: 认证授权相关接口
  - name: Users
    description: 用户管理相关接口
  - name: Bots
    description: Bot 管理相关接口
  - name: Conversations
    description: 会话管理相关接口
  - name: Knowledge
    description: 知识库管理相关接口

security:
  - BearerAuth: []

paths:
  # ========================================
  # 认证授权模块 (Auth)
  # ========================================
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: 用户注册
      description: |
        创建新用户账号

        **业务规则**:
        - 用户名必须唯一
        - 邮箱必须唯一且有效
        - 密码强度: 至少8位,包含大小写字母和数字
        - 注册成功后自动登录,返回 access_token

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              normal:
                summary: 正常注册
                value:
                  username: "zhangsan"
                  email: "zhangsan@example.com"
                  password: "Pass123456"
                  password_confirm: "Pass123456"

      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthResponse'
              examples:
                success:
                  summary: 注册成功
                  value:
                    code: "SUCCESS"
                    message: "注册成功"
                    data:
                      access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      expires_in: 7200
                      user:
                        user_id: "user_123"
                        username: "zhangsan"
                        email: "zhangsan@example.com"

        '400':
          $ref: '#/components/responses/BadRequest'

        '409':
          description: 用户已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                user_exists:
                  summary: 用户名已存在
                  value:
                    code: "USER301"
                    message: "该用户名已被注册"
                    message_zh: "该用户名已被注册"
                    message_en: "Username already exists"
                    request_id: "req_1234567890"
                    timestamp: "2025-01-01T12:00:00Z"

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: 用户登录
      description: |
        使用用户名/邮箱和密码登录

        **业务规则**:
        - 支持用户名或邮箱登录
        - 密码错误次数超过5次将临时锁定账号(30分钟)
        - 登录成功返回 access_token 和 refresh_token

      security: [] # 登录接口不需要认证

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              by_username:
                summary: 用户名登录
                value:
                  username: "zhangsan"
                  password: "Pass123456"
              by_email:
                summary: 邮箱登录
                value:
                  email: "zhangsan@example.com"
                  password: "Pass123456"

      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthResponse'
              examples:
                success:
                  summary: 登录成功
                  value:
                    code: "SUCCESS"
                    message: "登录成功"
                    data:
                      access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      expires_in: 7200
                      user:
                        user_id: "user_123"
                        username: "zhangsan"
                        email: "zhangsan@example.com"
                        avatar: "https://cdn.zker.com/avatars/user_123.png"

        '401':
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                wrong_password:
                  summary: 用户名或密码错误
                  value:
                    code: "AUTH201"
                    message: "用户名或密码错误"
                    message_zh: "用户名或密码错误"
                    message_en: "Invalid username or password"
                    request_id: "req_1234567890"
                    timestamp: "2025-01-01T12:00:00Z"
                account_locked:
                  summary: 账号已锁定
                  value:
                    code: "AUTH404"
                    message: "登录失败次数过多,账号已临时锁定"
                    message_zh: "登录失败次数过多,账号已临时锁定,请30分钟后再试"
                    message_en: "Account locked due to too many failed attempts"

        '429':
          description: 请求频率过高
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rate_limit:
                  summary: 登录尝试频繁
                  value:
                    code: "AUTH404"
                    message: "登录尝试次数过多,请稍后再试"

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: 用户登出
      description: |
        登出当前用户,使 Token 失效

        **业务规则**:
        - 将 access_token 加入黑名单
        - 清除服务端会话
        - 客户端也应删除本地存储的 token

      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                success:
                  summary: 登出成功
                  value:
                    code: "SUCCESS"
                    message: "登出成功"

        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: 刷新 Token
      description: |
        使用 refresh_token 获取新的 access_token

        **业务规则**:
        - refresh_token 有效期为30天
        - 刷新成功后返回新的 access_token 和 refresh_token
        - 旧的 refresh_token 立即失效

      security: [] # 刷新接口不需要 access_token

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  description: 刷新令牌
            examples:
              normal:
                summary: 正常刷新
                value:
                  refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthResponse'

        '401':
          description: refresh_token 无效或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_token:
                  summary: Token 无效
                  value:
                    code: "AUTH204"
                    message: "Refresh token 无效或已过期"

  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      summary: 获取当前用户信息
      description: 获取当前登录用户的详细信息

      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserDetail'

        '401':
          $ref: '#/components/responses/Unauthorized'

  # ========================================
  # 用户管理模块 (Users)
  # ========================================
  /api/v1/users:
    get:
      tags:
        - Users
      summary: 获取用户列表
      description: |
        分页获取用户列表,支持搜索和筛选

        **权限要求**:
        - 需要管理员权限

      parameters:
        - name: page
          in: query
          description: 页码 (从1开始)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: 每页数量
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: keyword
          in: query
          description: 搜索关键词 (用户名/邮箱)
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: 用户状态筛选
          required: false
          schema:
            type: string
            enum: [active, inactive, locked]
        - name: sort_by
          in: query
          description: 排序字段
          required: false
          schema:
            type: string
            enum: [created_at, username, email]
            default: created_at
        - name: sort_order
          in: query
          description: 排序方向
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc

      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserListResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/users/{user_id}:
    get:
      tags:
        - Users
      summary: 获取用户详情
      description: |
        获取指定用户的详细信息

        **权限要求**:
        - 管理员可以查看任何用户
        - 普通用户只能查看自己的信息

      parameters:
        - name: user_id
          in: path
          required: true
          description: 用户 ID
          schema:
            type: string

      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserDetail'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: 用户不存在
                  value:
                    code: "USER300"
                    message: "用户不存在"

    put:
      tags:
        - Users
      summary: 更新用户信息
      description: |
        更新用户基本信息

        **权限要求**:
        - 管理员可以更新任何用户
        - 普通用户只能更新自己的信息

      parameters:
        - name: user_id
          in: path
          required: true
          description: 用户 ID
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              update_profile:
                summary: 更新个人资料
                value:
                  nickname: "张三"
                  avatar: "https://cdn.zker.com/avatars/new.png"
                  bio: "AI 开发者"

      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserDetail'

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: 用户不存在
                  value:
                    code: "USER300"

    delete:
      tags:
        - Users
      summary: 删除用户
      description: |
        删除指定用户 (软删除)

        **权限要求**:
        - 仅管理员可操作

        **业务规则**:
        - 软删除,设置 deleted_at 字段
        - 用户的 Bot、会话等数据也会被软删除

      parameters:
        - name: user_id
          in: path
          required: true
          description: 用户 ID
          schema:
            type: string

      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                success:
                  summary: 删除成功
                  value:
                    code: "SUCCESS"
                    message: "删除成功"

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: 用户不存在
                  value:
                    code: "USER300"

  /api/v1/users/{user_id}/password:
    put:
      tags:
        - Users
      summary: 修改密码
      description: |
        修改用户密码

        **业务规则**:
        - 需要提供旧密码验证
        - 新密码不能与最近3次使用的密码相同
        - 密码强度: 至少8位,包含大小写字母和数字

      parameters:
        - name: user_id
          in: path
          required: true
          description: 用户 ID
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            examples:
              normal:
                summary: 正常修改密码
                value:
                  old_password: "Pass123456"
                  new_password: "NewPass123456"
                  new_password_confirm: "NewPass123456"

      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                success:
                  summary: 修改成功
                  value:
                    code: "SUCCESS"
                    message: "密码修改成功,请重新登录"

        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                wrong_old_password:
                  summary: 旧密码错误
                  value:
                    code: "AUTH201"
                    message: "旧密码错误"
                weak_password:
                  summary: 密码强度不足
                  value:
                    code: "AUTH400"
                    message: "密码强度不足,至少8位,包含大小写字母和数字"
                password_history:
                  summary: 密码历史冲突
                  value:
                    code: "AUTH401"
                    message: "新密码不能与最近3次使用的密码相同"

        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/{user_id}/roles:
    get:
      tags:
        - Users
      summary: 获取用户角色列表
      description: 获取指定用户的所有角色

      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string

      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Role'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    code: "USER300"

    post:
      tags:
        - Users
      summary: 为用户分配角色
      description: |
        为用户分配角色

        **权限要求**:
        - 仅管理员可操作

        **业务规则**:
        - 可以分配多个角色
        - 不能分配系统保留角色(除非是超级管理员)

      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role_ids
              properties:
                role_ids:
                  type: array
                  items:
                    type: string
                  description: 角色 ID 列表
                  example: ["role_admin", "role_user"]
            examples:
              assign_roles:
                summary: 分配角色
                value:
                  role_ids: ["role_admin", "role_developer"]

      responses:
        '200':
          description: 分配成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                success:
                  value:
                    code: "SUCCESS"
                    message: "角色分配成功"

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          description: 用户或角色不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                user_not_found:
                  value:
                    code: "USER300"
                role_not_found:
                  value:
                    code: "RBAC300"

    delete:
      tags:
        - Users
      summary: 移除用户角色
      description: |
        移除用户的指定角色

        **权限要求**:
        - 仅管理员可操作

        **业务规则**:
        - 不能移除用户的最后一个角色
        - 不能移除自己的管理员角色

      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role_id
              properties:
                role_id:
                  type: string
                  description: 要移除的角色 ID
            examples:
              remove_role:
                summary: 移除角色
                value:
                  role_id: "role_admin"

      responses:
        '200':
          description: 移除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

        '400':
          description: 业务规则限制
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                last_role:
                  summary: 最后一个角色不能移除
                  value:
                    code: "RBAC401"
                    message: "不能移除用户的最后一个角色"

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

  # ========================================
  # Bot 管理模块 (Bots)
  # ========================================
  /api/v1/bots:
    get:
      tags:
        - Bots
      summary: 获取 Bot 列表
      description: |
        分页获取当前租户的 Bot 列表,支持搜索和筛选

        **权限要求**:
        - 需要登录

        **业务规则**:
        - 只返回当前租户的 Bot
        - 支持按状态、标签筛选

      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: keyword
          in: query
          description: 搜索关键词 (Bot 名称/描述)
          schema:
            type: string
        - name: status
          in: query
          description: Bot 状态筛选
          schema:
            type: string
            enum: [draft, published, archived]
        - name: tags
          in: query
          description: 标签筛选 (逗号分隔)
          schema:
            type: string
            example: "客服,销售"
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [created_at, updated_at, name]
            default: updated_at
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc

      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BotListResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Bots
      summary: 创建 Bot
      description: |
        创建新的 Bot

        **权限要求**:
        - 需要登录

        **业务规则**:
        - Bot 名称在同一租户内必须唯一
        - 自动分配 Bot ID
        - 初始状态为 draft

        **配额限制**:
        - 免费版: 1个 Bot
        - 基础版: 5个 Bot
        - 专业版: 20个 Bot
        - 企业版: 无限

      requestBody:
        required: true
        content:
          application/json:
            schema:
