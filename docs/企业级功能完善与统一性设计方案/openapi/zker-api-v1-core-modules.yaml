      description: 分页获取会话的所有消息

      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
        - name: order
          in: query
          description: 排序方向
          schema:
            type: string
            enum: [asc, desc]
            default: asc

      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageListResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          description: 会话不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    code: "CONV300"

    post:
      tags:
        - Conversations
      summary: 发送消息
      description: |
        向会话发送新消息

        **业务规则**:
        - 自动处理消息内容和附件
        - 调用 Bot 生成回复(如果会话关联了 Bot)
        - 支持流式返回 Bot 回复

        **限制**:
        - 消息长度: 最大 10000 字符
        - 附件大小: 单个文件最大 10MB
        - 发送频率: 10条/分钟

      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            examples:
              text_only:
                summary: 纯文本消息
                value:
                  content: "你好,有什么可以帮助您的?"
              with_attachments:
                summary: 带附件的消息
                value:
                  content: "请分析这个图片"
                  content_type: "multimodal"
                  attachments:
                    - type: "image"
                      url: "https://cdn.zker.com/uploads/image.png"
                      name: "image.png"
              stream:
                summary: 流式返回
                value:
                  content: "生成一篇长文章"
                  stream: true

      responses:
        '200':
          description: 消息发送成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SendMessageResponse'

        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                content_too_long:
                  summary: 消息过长
                  value:
                    code: "CONV401"
                    message: "消息长度超过限制(最大10000字符)"
                file_too_large:
                  summary: 文件过大
                  value:
                    code: "CONV402"
                    message: "附件文件大小超过限制(最大10MB)"

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          description: 会话不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    code: "CONV300"

        '422':
          description: 会话状态不允许发送消息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                closed:
                  summary: 会话已关闭
                  value:
                    code: "CONV404"

        '429':
          description: 发送频率过高
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rate_limit:
                  summary: 发送太频繁
                  value:
                    code: "CONV405"
                    message: "消息发送频率超过限制,请稍后再试"

  # ========================================
  # 知识库管理模块 (Knowledge)
  # ========================================
  /api/v1/knowledge-bases:
    get:
      tags:
        - Knowledge
      summary: 获取知识库列表
      description: 分页获取当前租户的知识库列表

      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: keyword
          in: query
          description: 搜索关键词
          schema:
            type: string
        - name: type
          in: query
          description: 知识库类型筛选
          schema:
            type: string
            enum: [text, image, table, qa]

      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/KnowledgeBaseListResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Knowledge
      summary: 创建知识库
      description: |
        创建新的知识库

        **配额限制**:
        - 免费版: 1个知识库
        - 基础版: 5个知识库
        - 专业版: 20个知识库
        - 企业版: 无限

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeBaseRequest'
            examples:
              text_kb:
                summary: 文本知识库
                value:
                  name: "产品文档"
                  description: "产品相关文档"
                  type: "text"
                  chunk_strategy:
                    chunk_size: 500
                    overlap: 50

      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/KnowledgeBaseDetail'

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '422':
          description: 配额超限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                quota_exceeded:
                  value:
                    code: "KNW400"
                    message: "知识库数量超过租户配额"

  /api/v1/knowledge-bases/{knowledge_base_id}:
    get:
      tags:
        - Knowledge
      summary: 获取知识库详情

      parameters:
        - name: knowledge_base_id
