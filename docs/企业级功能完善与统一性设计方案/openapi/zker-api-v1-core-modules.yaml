        **权限要求**:
        - 需要登录

        **业务规则**:
        - 自动分配会话 ID
        - 初始状态为 active
        - 如果指定 Bot,会关联到该 Bot

        **配额限制**:
        - 免费版: 100个会话
        - 基础版: 1000个会话
        - 专业版: 10000个会话
        - 企业版: 无限

      requestBody:
        required: true
        content:
