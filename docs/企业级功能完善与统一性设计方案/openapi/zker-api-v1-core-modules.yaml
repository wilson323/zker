        - 只返回当前用户的会话
        - 按最后更新时间排序

      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: bot_id
          in: query
          description: 筛选指定 Bot 的会话
          schema:
            type: string
        - name: status
          in: query
          description: 会话状态筛选
          schema:
            type: string
            enum: [active, closed, archived]

      responses:
        '200':
          description: 成功
          content:
