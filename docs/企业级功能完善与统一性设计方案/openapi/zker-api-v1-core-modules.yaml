    put:
      tags:
        - Knowledge
      summary: 更新知识库

      parameters:
        - name: knowledge_base_id
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKnowledgeBaseRequest'

      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/KnowledgeBaseDetail'

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: 知识库不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    code: "KNW300"

    delete:
      tags:
        - Knowledge
      summary: 删除知识库

      parameters:
        - name: knowledge_base_id
          in: path
          required: true
          schema:
            type: string

      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: 知识库不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    code: "KNW300"

  /api/v1/knowledge-bases/{knowledge_base_id}/documents:
    post:
      tags:
        - Knowledge
      summary: 上传文档到知识库
      description: |
        上传文档到知识库

        **业务规则**:
        - 自动解析文档内容
        - 自动分块
        - 自动向量化

        **限制**:
        - 文件大小: 单个文件最大 50MB
        - 文档数量: 免费版100个,专业版1000个,企业版无限

      parameters:
        - name: knowledge_base_id
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 文档文件
                name:
                  type: string
                  description: 自定义文档名称
                metadata:
                  type: string
                  description: 文档元数据 (JSON string)

      responses:
        '201':
          description: 上传成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DocumentDetail'

        '400':
          description: 文件格式不支持或过大
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_format:
                  summary: 不支持的文件格式
                  value:
                    code: "KNW403"
                    message: "不支持的文档格式"
                file_too_large:
                  summary: 文件过大
                  value:
                    code: "KNW402"
                    message: "文档大小超过限制(最大50MB)"

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: 知识库不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    code: "KNW300"

        '422':
          description: 文档数量超限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                quota_exceeded:
                  value:
                    code: "KNW401"
                    message: "文档数量超过租户配额,请升级订阅方案"

  /api/v1/knowledge-bases/{knowledge_base_id}/search:
    post:
      tags:
        - Knowledge
      summary: 检索知识库
      description: |
        在知识库中检索相关内容

        **业务规则**:
        - 使用混合检索(向量+关键词)
        - 返回最相关的 Top-K 结果

        **参数**:
        - top_k: 返回结果数 (1-20,默认5)
        - score_threshold: 相似度阈值 (0-1,默认0.7)

      parameters:
        - name: knowledge_base_id
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: 检索问题
                  example: "如何重置密码?"
                top_k:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 5
                  description: 返回结果数
                score_threshold:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 1
                  default: 0.7
                  description: 相似度阈值
            examples:
              simple:
                summary: 简单检索
                value:
                  query: "如何重置密码?"
              advanced:
                summary: 高级检索
                value:
                  query: "如何重置密码?"
                  top_k: 10
                  score_threshold: 0.8

      responses:
        '200':
          description: 检索成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/KnowledgeChunk'
              examples:
                success:
                  summary: 检索成功
                  value:
                    code: "SUCCESS"
                    message: "检索成功"
                    data:
                      - chunk_id: "chunk_123"
                        content: "重置密码的步骤如下..."
                        score: 0.95
                        document:
                          document_id: "doc_123"
                          name: "用户手册.pdf"

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: 知识库不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    code: "KNW300"

# ========================================
# 组件定义 (Components)
# ========================================
components:
  # ========================================
  # 安全方案 (Security Schemes)
  # ========================================
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Token 认证

        在 Header 中携带:
        ```
        Authorization: Bearer <access_token>
        ```

  # ========================================
  # 通用 Schema (Common Schemas)
  # ========================================
  schemas:
    # 通用 API 响应
    ApiResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 响应码
          example: "SUCCESS"
        message:
          type: string
          description: 响应消息
          example: "操作成功"
        message_zh:
          type: string
          description: 中文消息
        message_en:
          type: string
          description: 英文消息
        request_id:
          type: string
          description: 请求追踪 ID
          example: "req_1234567890"
        timestamp:
          type: string
          format: date-time
          description: 响应时间戳
          example: "2025-01-01T12:00:00Z"

    # 错误响应
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 错误码
          example: "AUTH201"
        message:
          type: string
          description: 错误消息
          example: "用户名或密码错误"
        message_zh:
          type: string
          description: 中文错误消息
        message_en:
          type: string
          description: 英文错误消息
        details:
          type: object
          description: 错误详情
          additionalProperties: true
        request_id:
          type: string
          description: 请求追踪 ID
        timestamp:
          type: string
          format: date-time

    # 分页响应
    PaginatedResponse:
      type: object
      required:
        - items
        - total
        - page
        - page_size
      properties:
        items:
          type: array
          items: {}
          description: 数据列表
        total:
          type: integer
          description: 总数
        page:
          type: integer
          description: 当前页码
        page_size:
          type: integer
          description: 每页数量
        total_pages:
          type: integer
          description: 总页数
        has_more:
          type: boolean
          description: 是否有更多数据

    # ========================================
    # 认证模块 Schemas
    # ========================================
    # 注册请求
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
        - password_confirm
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[a-zA-Z0-9_]+$'
          description: 用户名 (3-20位,字母数字下划线)
          example: "zhangsan"
        email:
          type: string
          format: email
          description: 邮箱地址
          example: "zhangsan@example.com"
        password:
          type: string
          minLength: 8
          description: 密码 (至少8位)
          example: "Pass123456"
        password_confirm:
          type: string
          description: 确认密码
          example: "Pass123456"

    # 登录请求
    LoginRequest:
      oneOf:
        - type: object
          required:
            - username
            - password
          properties:
            username:
              type: string
              description: 用户名
            password:
              type: string
              description: 密码
        - type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
              description: 邮箱
            password:
              type: string
              description: 密码

    # 认证响应
    AuthResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - expires_in
        - user
      properties:
        access_token:
          type: string
          description: 访问令牌
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          description: 刷新令牌
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        expires_in:
          type: integer
          description: 访问令牌过期时间 (秒)
          example: 7200
        token_type:
          type: string
          default: "Bearer"
          description: 令牌类型
        user:
          $ref: '#/components/schemas/UserDetail'

    # ========================================
    # 用户模块 Schemas
    # ========================================
    # 用户详情
    UserDetail:
      type: object
      required:
        - user_id
        - username
        - email
        - status
      properties:
        user_id:
          type: string
          description: 用户 ID
          example: "user_123"
        tenant_id:
          type: string
          description: 租户 ID
          example: "tenant_456"
        username:
          type: string
          description: 用户名
          example: "zhangsan"
        email:
          type: string
          format: email
          description: 邮箱
          example: "zhangsan@example.com"
        nickname:
          type: string
          description: 昵称
          example: "张三"
        avatar:
          type: string
          format: uri
          description: 头像 URL
          example: "https://cdn.zker.com/avatars/user_123.png"
        bio:
          type: string
          description: 个人简介
          example: "AI 开发者"
        status:
          type: string
          enum: [active, inactive, locked]
          description: 用户状态
        role:
          type: string
          description: 主要角色
          example: "admin"
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间

    # 用户列表响应
    UserListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/UserDetail'

    # 更新用户请求
    UpdateUserRequest:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 50
          description: 昵称
        avatar:
          type: string
          format: uri
          description: 头像 URL
        bio:
          type: string
          maxLength: 200
          description: 个人简介

    # 修改密码请求
    ChangePasswordRequest:
      type: object
      required:
        - old_password
        - new_password
        - new_password_confirm
      properties:
        old_password:
          type: string
          minLength: 8
          description: 旧密码
        new_password:
          type: string
          minLength: 8
          description: 新密码
        new_password_confirm:
          type: string
          minLength: 8
          description: 确认新密码

    # 角色
    Role:
      type: object
      required:
        - role_id
        - name
        - code
      properties:
        role_id:
          type: string
          description: 角色 ID
        name:
          type: string
          description: 角色名称
        code:
          type: string
          description: 角色代码
        description:
          type: string
          description: 角色描述
        is_system:
          type: boolean
          description: 是否系统角色
        permissions:
          type: array
          items:
            type: string
          description: 权限列表

    # ========================================
    # Bot 模块 Schemas
    # ========================================
    # Bot 详情
    BotDetail:
      type: object
      required:
        - bot_id
        - name
        - status
        - created_at
      properties:
        bot_id:
          type: string
          description: Bot ID
        tenant_id:
          type: string
          description: 租户 ID
        name:
          type: string
          description: Bot 名称
        description:
          type: string
          description: Bot 描述
        avatar:
          type: string
          format: uri
          description: Bot 头像
        status:
          type: string
          enum: [draft, published, archived]
          description: Bot 状态
        model_config:
          $ref: '#/components/schemas/ModelConfig'
        prompt_config:
          $ref: '#/components/schemas/PromptConfig'
        created_by:
          type: string
          description: 创建者 ID
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # 模型配置
    ModelConfig:
      type: object
      required:
        - model_id
      properties:
        model_id:
          type: string
          description: 模型 ID
          example: "gpt-4-turbo-preview"
        temperature:
          type: number
          format: float
          minimum: 0
          maximum: 2
          default: 0.7
          description: 温度参数 (0-2)
        max_tokens:
          type: integer
          minimum: 1
          maximum: 128000
          default: 2000
          description: 最大 Token 数
        top_p:
          type: number
          format: float
          minimum: 0
          maximum: 1
          default: 1
          description: Top-P 采样
        frequency_penalty:
          type: number
          format: float
          minimum: -2
          maximum: 2
          default: 0
          description: 频率惩罚
        presence_penalty:
          type: number
          format: float
          minimum: -2
          maximum: 2
          default: 0
          description: 存在惩罚

    # 提示词配置
    PromptConfig:
      type: object
      properties:
        system_prompt:
          type: string
          description: 系统提示词
        welcome_message:
          type: string
          description: 欢迎语
        suggested_questions:
          type: array
          items:
            type: string
          description: 建议问题列表

    # 创建 Bot 请求
    CreateBotRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Bot 名称
        description:
          type: string
          maxLength: 500
          description: Bot 描述
        avatar:
          type: string
          format: uri
          description: Bot 头像 URL
        model_config:
          $ref: '#/components/schemas/ModelConfig'
        prompt_config:
          $ref: '#/components/schemas/PromptConfig'

    # 更新 Bot 请求
    UpdateBotRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        avatar:
          type: string
          format: uri
        model_config:
          $ref: '#/components/schemas/ModelConfig'
        prompt_config:
          $ref: '#/components/schemas/PromptConfig'

    # Bot 列表响应
    BotListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/BotDetail'

    # Bot 版本
    BotVersion:
      type: object
      required:
        - version_id
        - version_number
        - created_at
      properties:
        version_id:
          type: string
          description: 版本 ID
        version_number:
          type: integer
          description: 版本号
        changes:
          type: string
          description: 版本变更说明
        config:
          type: object
          description: 版本配置
        created_by:
          type: string
          description: 创建者 ID
        created_at:
          type: string
          format: date-time

    # ========================================
    # 会话模块 Schemas
    # ========================================
    # 会话详情
    ConversationDetail:
      type: object
      required:
        - conversation_id
        - user_id
        - status
        - created_at
      properties:
        conversation_id:
          type: string
          description: 会话 ID
        bot_id:
          type: string
          description: 关联的 Bot ID
        user_id:
          type: string
          description: 用户 ID
        title:
          type: string
          description: 会话标题
        status:
          type: string
          enum: [active, closed, archived]
          description: 会话状态
        message_count:
          type: integer
          description: 消息数量
        last_message_at:
          type: string
          format: date-time
          description: 最后消息时间
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: 消息列表

    # 消息
    Message:
      type: object
      required:
        - message_id
        - role
        - content
        - created_at
      properties:
        message_id:
          type: string
          description: 消息 ID
        conversation_id:
          type: string
          description: 会话 ID
        role:
          type: string
          enum: [user, assistant, system]
          description: 角色
        content:
          type: string
          description: 消息内容
        content_type:
          type: string
          enum: [text, image, file, multimodal, function_call]
          description: 内容类型
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: 附件列表
        metadata:
          type: object
          description: 元数据
        created_at:
          type: string
          format: date-time

    # 附件
    Attachment:
      type: object
      required:
        - type
        - url
      properties:
        type:
          type: string
          enum: [image, file, video, audio]
          description: 附件类型
        url:
          type: string
          format: uri
          description: 附件 URL
        name:
          type: string
          description: 文件名
        size:
          type: integer
          description: 文件大小 (字节)
        mime_type:
          type: string
          description: MIME 类型

    # 会话列表响应
    ConversationListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ConversationDetail'

    # 创建会话请求
    CreateConversationRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: 会话标题
        bot_id:
          type: string
          description: 关联的 Bot ID
        initial_message:
          type: string
          description: 初始消息

    # 更新会话请求
    UpdateConversationRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          enum: [active, closed, archived]

    # 发送消息请求
    SendMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 10000
          description: 消息内容
        content_type:
          type: string
          enum: [text, multimodal]
          default: text
          description: 内容类型
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: 附件列表
        stream:
          type: boolean
          default: false
          description: 是否流式返回

    # 发送消息响应
    SendMessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          $ref: '#/components/schemas/Message'
        reply:
          $ref: '#/components/schemas/Message'
          description: Bot 回复 (如果非流式)
        stream_id:
          type: string
          description: 流式返回 ID (如果流式)

    # 消息列表响应
    MessageListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Message'

    # ========================================
    # 知识库模块 Schemas
    # ========================================
    # 知识库详情
    KnowledgeBaseDetail:
      type: object
      required:
        - knowledge_base_id
        - name
        - type
        - created_at
      properties:
        knowledge_base_id:
          type: string
          description: 知识库 ID
        tenant_id:
          type: string
          description: 租户 ID
        name:
          type: string
          description: 知识库名称
        description:
          type: string
          description: 知识库描述
        type:
          type: string
          enum: [text, image, table, qa]
          description: 知识库类型
        document_count:
          type: integer
          description: 文档数量
        chunk_count:
          type: integer
          description: 分块数量
        chunk_strategy:
          $ref: '#/components/schemas/ChunkStrategy'
        created_by:
          type: string
          description: 创建者 ID
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # 分块策略
    ChunkStrategy:
      type: object
      properties:
        chunk_size:
          type: integer
          description: 分块大小 (字符数)
          example: 500
        overlap:
          type: integer
          description: 重叠大小 (字符数)
          example: 50
        separator:
          type: string
          description: 分隔符
          example: "\n\n"

    # 知识库列表响应
    KnowledgeBaseListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/KnowledgeBaseDetail'

    # 创建知识库请求
    CreateKnowledgeBaseRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 知识库名称
        description:
          type: string
          maxLength: 500
          description: 知识库描述
        type:
          type: string
          enum: [text, image, table, qa]
          description: 知识库类型
        chunk_strategy:
          $ref: '#/components/schemas/ChunkStrategy'

    # 更新知识库请求
    UpdateKnowledgeBaseRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        chunk_strategy:
          $ref: '#/components/schemas/ChunkStrategy'

    # 文档详情
    DocumentDetail:
      type: object
      required:
        - document_id
        - name
        - status
        - created_at
      properties:
        document_id:
          type: string
          description: 文档 ID
        knowledge_base_id:
          type: string
          description: 知识库 ID
        name:
          type: string
          description: 文档名称
        type:
          type: string
          description: 文档类型
        size:
          type: integer
          description: 文件大小 (字节)
        status:
          type: string
          enum: [pending, processing, completed, failed]
          description: 处理状态
        chunk_count:
          type: integer
          description: 分块数量
        error:
          type: string
          description: 错误信息 (如果失败)
        created_at:
          type: string
          format: date-time

    # 知识分块
    KnowledgeChunk:
      type: object
      required:
        - chunk_id
        - content
        - score
      properties:
        chunk_id:
          type: string
          description: 分块 ID
        document_id:
          type: string
          description: 文档 ID
        content:
          type: string
          description: 分块内容
        score:
          type: number
          format: float
          description: 相似度分数
        metadata:
          type: object
          description: 元数据
        document:
          $ref: '#/components/schemas/DocumentDetail'

  # ========================================
  # 通用响应 (Responses)
  # ========================================
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_params:
              summary: 参数错误
              value:
                code: "SYS100"
                message: "请求参数不正确"

    Unauthorized:
      description: 未授权
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_logged_in:
              summary: 未登录
              value:
                code: "AUTH200"
                message: "用户未登录或登录已过期"
            invalid_token:
              summary: Token 无效
              value:
                code: "AUTH202"
                message: "Access token 无效或已过期"

    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            no_permission:
              summary: 权限不足
              value:
                code: "AUTH300"
                message: "无权限访问该资源"

    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_found:
              summary: 资源不存在
              value:
                code: "SYS301"
                message: "请求的资源不存在"

    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internal_error:
              summary: 内部错误
              value:
                code: "SYS500"
                message: "系统内部错误,请联系管理员"

    TooManyRequests:
      description: 请求频率过高
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rate_limit:
              summary: 超出频率限制
              value:
                code: "API600"
                message: "请求频率超过限制,请稍后再试"
