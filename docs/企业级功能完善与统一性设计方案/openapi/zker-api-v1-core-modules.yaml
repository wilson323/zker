                  value:
                    code: "BOT502"
                    message: "Bot 已发布,需要先下线才能删除"

  /api/v1/bots/{bot_id}/publish:
    post:
      tags:
        - Bots
      summary: 发布 Bot
      description: |
        发布 Bot,使其可公开访问

        **权限要求**:
        - Bot 所有者
        - 管理员

        **业务规则**:
        - Bot 必须通过审核才能发布
        - 发布后 Bot 状态变为 published
        - 发布后 Bot 不能直接修改,需要创建新版本

      parameters:
        - name: bot_id
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                publish_channels:
                  type: array
                  items:
                    type: string
                  description: 发布渠道
                  example: ["web", "wechat", "api"]
            examples:
              with_channels:
                summary: 指定发布渠道
                value:
                  publish_channels: ["web", "api"]

      responses:
        '200':
          description: 发布成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          publish_id:
                            type: string
                            description: 发布记录 ID
                          status:
                            type: string
                            enum: [pending, approved, rejected]
                            description: 发布状态
              examples:
                success:
                  summary: 发布成功
                  value:
                    code: "SUCCESS"
                    message: "Bot 发布成功"
                    data:
                      publish_id: "pub_123"
                      status: "approved"

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          description: Bot 不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    code: "BOT300"

        '422':
          description: Bot 状态不允许发布
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                audit_failed:
                  summary: 审核未通过
                  value:
                    code: "BOT407"
                    message: "Bot 发布审核未通过,请修改后重新提交"

